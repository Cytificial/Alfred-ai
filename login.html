<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfred AI</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0a1226;font-family:system-ui;color:#eaf4ff}
.card{width:min(92vw,380px);background:rgba(10,20,44,.94);border:1px solid rgba(110,170,255,.22);
border-radius:22px;padding:26px 22px;box-shadow:0 24px 80px rgba(0,0,0,.55);text-align:center}
.logo{width:64px;height:64px;line-height:64px;margin:0 auto 10px;border-radius:50%;
background:linear-gradient(135deg,#3b82f6,#22d3ee);font-weight:800;font-size:30px;
box-shadow:0 0 30px rgba(59,130,246,.5)}
.title{font-size:20px;font-weight:800;letter-spacing:4px}
.sub{font-size:12px;color:#9db8e8;margin:4px 0 16px}
.wb{font-size:15px;font-weight:700;margin:0 0 4px}
input{width:100%;box-sizing:border-box;margin:8px 0;padding:12px 14px;border-radius:12px;
border:1px solid rgba(120,180,255,.28);background:rgba(255,255,255,.06);color:#eaf4ff;font-size:15px;outline:none}
input:focus{border-color:#5ec8ff}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:#b9c9ec;margin:8px 2px;text-align:left}
.btn{width:100%;margin:12px 0 4px;padding:13px;border:0;border-radius:26px;
background:linear-gradient(90deg,#3b82f6,#06b6d4);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.err{display:none;color:#ff9db1;font-size:13px;margin:6px 0;min-height:16px}
.alt{color:#7fc4ff;font-size:13px;margin:8px 0 2px;cursor:pointer}
.or{color:#8fa6cf;font-size:11px;margin:14px 0 8px;letter-spacing:1px}
.row{display:flex;gap:10px;justify-content:center}
.prov{padding:9px 14px;border-radius:20px;border:1px solid rgba(120,180,255,.3);
background:rgba(255,255,255,.05);font-size:13px;color:#dce9ff;cursor:pointer}

/* v195: match the app's mood */
body{background:
  radial-gradient(900px 500px at 15% 8%, rgba(59,130,246,.28), transparent 60%),
  radial-gradient(800px 500px at 85% 95%, rgba(34,211,238,.16), transparent 60%),
  #0a1226;}
.card{border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 60px rgba(59,130,246,.25)}
@media (min-width:600px){.card{backdrop-filter:blur(6px)}}
.wb{font-size:17px;letter-spacing:.5px;margin:2px 0 10px}
.btn{transition:box-shadow .2s}
.btn:hover{box-shadow:0 0 24px rgba(59,130,246,.45)}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #101c38 inset;-webkit-text-fill-color:#eaf4ff}
/* v195 end */
</style>
<div class="card">
  <div class="logo">A</div>
  <div class="title">ALFRED AI</div>
  <div class="sub">Your Mind, Amplified.</div>
  <div class="wb" id="wb">Welcome Back</div>
  <input id="name" placeholder="Your name" style="display:none">
  <input id="email" type="email" placeholder="Email address">
  <input id="pass" type="password" placeholder="Password">
  <label class="rem"><input id="rem" type="checkbox"> Remember me</label>
  <button class="btn" id="go">Enter Alfred</button>
  <div class="err" id="err"></div>
  <div class="alt" id="mode">New here? Join Alfred</div>
  <div class="or">OR CONTINUE WITH</div>
  <div class="row">
    <div class="prov" data-p="google">Google</div>
    <div class="prov" data-p="github">GitHub</div>
    <div class="prov" data-p="discord">Discord</div>
  </div>
</div>
<script>
var mode="login", b=document.getElementById("go");
function fail(m){ var e=document.getElementById("err"); e.style.display=m?"block":"none"; e.textContent=m||""; }
document.getElementById("mode").onclick=function(){
  mode = mode==="login" ? "register" : "login";
  document.getElementById("name").style.display = mode==="register" ? "block" : "none";
  document.getElementById("wb").textContent = mode==="register" ? "Create your account" : "Welcome Back";
  b.textContent = mode==="register" ? "Join Alfred" : "Enter Alfred";
  this.textContent = mode==="register" ? "Have an account? Enter Alfred" : "New here? Join Alfred";
  fail("");
};
[].slice.call(document.querySelectorAll(".prov")).forEach(function(p){
  p.onclick=function(){ location.href = location.protocol + "//" + location.hostname + ":8081/oauth/" + p.getAttribute("data-p"); };
});
function go(){
  var e=document.getElementById("email").value.trim(),
      p=document.getElementById("pass").value,
      n=(document.getElementById("name").value||"").trim();
  fail("");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return fail("Enter a valid email address.");
  if(p.length<8) return fail("Password must be at least 8 characters.");
  if(mode==="register" && n.length<2) return fail("Enter your name.");
  b.disabled=true; b.textContent="One moment…";
  var body = mode==="register" ? {name:n,email:e,password:p} : {email:e,password:p,remember:document.getElementById("rem").checked};
  fetch("/api/auth/"+mode,{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){return{s:r.status,j:j};});})
  .then(function(x){
    if(x.j&&x.j.ok&&x.j.token){
      try{
        localStorage.setItem("alfred_token",x.j.token);
        localStorage.setItem("alfred_authed","1");
        if(x.j.user&&x.j.user.name) localStorage.setItem("alfred_name",x.j.user.name);
        if(x.j.user&&x.j.user.plan) localStorage.setItem("alfred_plan",
          JSON.stringify({id:x.j.user.plan.toLowerCase(),name:x.j.user.plan}));
      }catch(e){}
      location.replace("/#/chat");
    } else {
      b.disabled=false; b.textContent = mode==="register" ? "Join Alfred" : "Enter Alfred";
      fail((x.j&&x.j.error)||("Rejected by server (HTTP "+x.s+")."));
    }
  }).catch(function(){ b.disabled=false; b.textContent="Enter Alfred"; fail("Network error — is the server running?"); });
}
b.onclick=go;
document.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } });
</script>
