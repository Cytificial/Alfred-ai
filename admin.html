<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfred · Admin</title>
<style>
:root{--bg:#080D17;--panel:#0E1729;--line:rgba(255,255,255,.09);--txt:#E7EFF8;
--dim:rgba(231,239,248,.55);--acc:#7CC4FF;--ok:#9BE7C4;--bad:#FF9DB0;--warn:#FFD37A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
position:relative;background:rgba(8,13,23,.96);backdrop-filter:blur(12px);z-index:5;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.3px}
.pill{font:11px system-ui;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.pill.bad{color:var(--bad);border-color:rgba(255,157,176,.4)}
.pill.ok{color:var(--ok);border-color:rgba(155,231,196,.4)}
nav{display:flex;gap:6px;padding:11px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;
position:sticky;top:var(--bar);background:rgba(8,13,23,.96);z-index:4}
nav button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:8px 13px;
border-radius:999px;font:600 12.5px system-ui;cursor:pointer}
nav button.on{background:rgba(124,196,255,.14);border-color:rgba(124,196,255,.45);color:var(--acc)}
main{padding:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:1200px;margin:0 auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 8px}
table{width:max-content;min-width:100%;border-collapse:collapse;margin:10px 0 8px;font-size:12.5px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
position:sticky;top:0;background:var(--bg)}
td.wrap{max-width:340px;overflow-wrap:anywhere;color:var(--dim);font-size:11.5px}
select,input,button.act{background:#111C31;color:var(--txt);border:1px solid var(--line);
border-radius:9px;padding:6px 10px;font:12.5px system-ui}
button.act{cursor:pointer;background:rgba(124,196,255,.14);border-color:rgba(124,196,255,.4);
color:var(--acc);font-weight:600}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}
.card h3{margin:0 0 3px;font-size:14.5px}
.card .sub{color:var(--dim);font-size:12px;margin-bottom:11px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.card dt{color:var(--dim)}
.card dd{margin:0;overflow-wrap:anywhere}
.greet{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);color:var(--dim);
font-style:italic;font-size:12px}
.msg{padding:9px 12px;border-radius:10px;margin-bottom:13px;font-size:12.5px;display:none}
.msg.ok{display:block;background:rgba(155,231,196,.12);border:1px solid rgba(155,231,196,.35);color:var(--ok)}
.msg.err{display:block;background:rgba(255,157,176,.12);border:1px solid rgba(255,157,176,.35);color:var(--bad)}
.empty{color:var(--dim);padding:22px 0;font-size:12.5px}
pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
overflow:auto;font:11.5px ui-monospace,monospace;color:var(--dim);max-height:60vh}
/* login */
#gate{max-width:380px;margin:12vh auto;padding:0 18px}
#gate .card{padding:24px}
#gate h2{margin:0 0 4px;font-size:19px}
#gate p.sub{margin:0 0 18px}
#gate input{width:100%;margin-bottom:11px;padding:11px 12px;font-size:14px}
#gate button{width:100%;margin-top:6px;padding:12px;font-size:14px;font-weight:650;
background:linear-gradient(90deg,#3B82F6,#06B6D4);border:0;border-radius:11px;color:#fff;cursor:pointer}
</style></head><body>

<div id="gate"><div class="card">
  <h2>Alfred · Admin</h2>
  <p class="sub">Manager sign-in</p>
  <input id="em" type="email" placeholder="admin@alfred.ai" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <div class="msg" id="gmsg"></div>
</div></div>

<div id="app" style="display:none">
<header><h1>ALFRED · ADMIN</h1>
  <span class="pill" id="who">—</span>
  <span class="pill" id="eng">—</span>
  <span style="flex:1"></span>
  <button class="act" id="refresh">Refresh</button>
  <button class="act" id="out">Sign out</button>
</header>
<nav id="tabs"></nav>
<main><div class="msg" id="msg"></div><div id="out2"></div></main>
</div>

<script>
var OUT=document.getElementById("out2"), MSG=document.getElementById("msg"),
    GATE=document.getElementById("gate"), APP=document.getElementById("app"),
    TABS=document.getElementById("tabs"), WHO=document.getElementById("who");

function tok(){try{return localStorage.getItem("alfred_admin_token")||""}catch(e){return ""}}
function say(t,ok){MSG.className="msg "+(ok?"ok":"err");MSG.textContent=t;
  setTimeout(function(){MSG.className="msg"},3200)}
function gsay(t,ok){var m=document.getElementById("gmsg");m.className="msg "+(ok?"ok":"err");m.textContent=t}

function api(path,body){
  var o={credentials:"include",headers:{}};
  var t=tok(); if(t) o.headers["X-Alfred-Token"]=t;
  if(body){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  return fetch(path,o).then(function(r){
    return r.json().catch(function(){return {ok:false,error:"non-json ("+r.status+")"}});
  },function(){return {ok:false,error:"network error"}});
}


function tierText(v){
  if (v == null) return "—";
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  var o = v.plan || v.tier || v;
  if (o && typeof o === "object") return o.name || o.tier || o.id || o.label || "Free";
  return String(o);
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function short(v){
  if(v==null) return "—";
  if(typeof v==="object"){try{return JSON.stringify(v)}catch(e){return String(v)}}
  var s=String(v); return s.length>120?s.slice(0,118)+"…":s;
}

/* generic renderer - works whatever shape the endpoint returns */
function auto(data){
  if(data==null) return '<div class="empty">no data</div>';
  if(Array.isArray(data)){
    if(!data.length) return '<div class="empty">empty</div>';
    if(typeof data[0]!=="object") return "<pre>"+esc(JSON.stringify(data,null,2))+"</pre>";
    var keys=[]; data.forEach(function(r){Object.keys(r).forEach(function(k){
      if(keys.indexOf(k)<0) keys.push(k)})});
    return "<table><thead><tr>"+keys.map(function(k){return "<th>"+esc(k)+"</th>"}).join("")
      +"</tr></thead><tbody>"+data.map(function(r){
        return "<tr>"+keys.map(function(k){
          return '<td class="wrap">'+esc(short(r[k]))+"</td>"}).join("")+"</tr>";
      }).join("")+"</tbody></table>";
  }
  if(typeof data==="object"){
    var ks=Object.keys(data);
    var arrs=ks.filter(function(k){return Array.isArray(data[k])});
    var scalars=ks.filter(function(k){return !Array.isArray(data[k])});
    var h="";
    if(scalars.length) h+="<dl class='card' style='margin:0 0 12px'>"+scalars.map(function(k){
      return "<dt>"+esc(k)+"</dt><dd>"+esc(short(data[k]))+"</dd>"}).join("")+"</dl>";
    arrs.forEach(function(k){ h+="<h3 style='font-size:13px;margin:14px 0 0'>"+esc(k)
      +" ("+(data[k]||[]).length+")</h3>"+auto(data[k]); });
    return h||"<div class='empty'>empty object</div>";
  }
  return "<pre>"+esc(String(data))+"</pre>";
}

function show(j,custom){
  if(j && j.ok===false && j.error && !j.users && !j.tiers && !j.rows){
    OUT.innerHTML="<div class='empty'>"+esc(j.error)+"</div>"; return;
  }
  OUT.innerHTML = custom ? custom(j) : auto(j);
}

/* ---------- tabs ---------- */
var VIEWS = {
  overview:{label:"Overview",get:function(){return api("/api/admin/overview")}},
  users:{label:"Users",get:function(){return api("/api/admin/overview")},
    render:function(j){
      var rows=(j.users||[]).map(function(u){
        return "<tr><td>"+esc(u.email)+"</td><td>"+esc(u.name)+"</td><td>"
          +"<select data-e='"+esc(u.email)+"'>"+["Free","Pro","Ultra"].map(function(p){
              return "<option"+(p===u.plan?" selected":"")+">"+p+"</option>"}).join("")
          +"</select></td><td>"
          +"<button class='act' data-save='"+esc(u.email)+"'>Save</button> "
          +"<button class='act' data-revoke='"+esc(u.email)+"'>Revoke</button> "
          +"<button class='act' data-del='"+esc(u.email)+"'>Delete</button></td></tr>";
      }).join("");
      return "<h3 style='font-size:13px'>Users ("+(j.users||[]).length+")</h3>"
        +"<table><thead><tr><th>Email</th><th>Name</th><th>Tier</th><th>Actions</th></tr></thead>"
        +"<tbody>"+(rows||"")+"</tbody></table>";
    }},
  tiers:{label:"Tiers",get:function(){return api("/api/admin/tiers")},
    render:function(j){
      return "<div class='cards'>"+(j.tiers||[]).map(function(t){
        return "<div class='card'><h3>"+esc(t.name)+"</h3>"
          +"<div class='sub'>"+esc(t.id)+" · rank "+esc(t.rank)+"</div><dl>"
          +"<dt>daily cap</dt><dd>"+esc(t.daily_cap)+"</dd>"
          +"<dt>council</dt><dd>"+esc(t.council)+"</dd>"
          +"<dt>refine</dt><dd>"+(t.refine?"yes":"no")+"</dd>"
          +"<dt>chain</dt><dd>"+esc(t.chain_key)+"</dd>"
          +"<dt>prompt</dt><dd>"+esc(t.prompt_key)+"</dd>"
          +"<dt>accent</dt><dd>"+esc((t.theme||{}).accent||"—")+"</dd>"
          +"</dl><div class='greet'>"+esc(t.greeting)+"</div></div>";
      }).join("")+"</div>";
    }},
  audit:{label:"Audit",get:function(){return api("/api/admin/audit")}},
  brain:{label:"Brain",get:function(){return api("/api/admin/brain")}},
  providers:{label:"Providers",get:function(){return api("/api/admin/providers")}},
  billing:{label:"Billing",get:function(){return api("/api/admin/credits/full")}},
  credits:{label:"Credits",get:function(){return api("/api/admin/credits")}},
  lab:{label:"Lab",get:function(){return api("/api/admin/lab")}},
  showcase:{label:"Showcase",get:function(){return api("/api/admin/showcase")}},
  feedback:{label:"Feedback",get:function(){return api("/api/admin/feedback")}},
  metrics:{label:"Metrics",get:function(){return api("/api/admin/metrics")}},
  stats:{label:"Stats",get:function(){return api("/api/admin/stats")}}
};
var ORDER=["overview","users","tiers","audit","brain","providers","billing","credits",
 "lab","showcase","feedback","metrics","stats"];
var cur="overview";

function buildTabs(){
  TABS.innerHTML=ORDER.map(function(k){
    return '<button data-k="'+k+'"'+(k===cur?' class="on"':"")+">"+VIEWS[k].label+"</button>";
  }).join("");
}
function open(k){
  cur=k;
  TABS.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.k===k)});
  OUT.innerHTML="<div class='empty'>loading…</div>";
  VIEWS[k].get().then(function(j){
    if(j && j.engine) document.getElementById("eng").textContent=j.engine;
    show(j, VIEWS[k].render);
  });
}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.tagName==="BUTTON"&&t.dataset.k){open(t.dataset.k);return}
  if(t.id==="refresh"){open(cur);return}
  if(t.id==="out"){try{localStorage.removeItem("alfred_admin_token")}catch(x){}
    location.reload();return}
  if(t.dataset.save){
    var em=t.dataset.save, sel=document.querySelector("select[data-e='"+em+"']");
    if(!sel)return;
    api("/api/admin/users/plan",{email:em,plan:sel.value}).then(function(j){
      say(j.ok?(em+" → "+j.plan):(j.error||"failed"),!!j.ok); open("users");
    });
  }
  if(t.dataset.revoke){
    api("/api/admin/users/revoke",{email:t.dataset.revoke}).then(function(j){
      say(j.ok?("sessions revoked for "+t.dataset.revoke):(j.error||"failed"),!!j.ok)});
  }
  if(t.dataset.del){
    if(!confirm("Delete "+t.dataset.del+"? This removes the account."))return;
    api("/api/admin/users/delete",{email:t.dataset.del}).then(function(j){
      say(j.ok?("deleted "+t.dataset.del):(j.error||"failed"),!!j.ok); open("users");
    });
  }
});

/* ---------- gate ---------- */
function enter(email){
  GATE.style.display="none"; APP.style.display="block";
  WHO.textContent=email; buildTabs(); open("overview");
}
document.getElementById("go").addEventListener("click",function(){
  var em=document.getElementById("em").value.trim().toLowerCase();
  var pw=document.getElementById("pw").value;
  if(!em||!pw){gsay("email and password required",false);return}
  fetch("/api/auth/login",{method:"POST",credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:em,password:pw})})
   .then(function(r){return r.json()})
   .then(function(j){
     if(!j||!j.ok){gsay((j&&j.error)||"sign in failed",false);return}
     try{localStorage.setItem("alfred_admin_token",j.token)}catch(x){}
     try{localStorage.setItem("alfred_name",(j.user&&j.user.name)||em)}catch(x){}
     enter(em);
   }).catch(function(){gsay("network error",false)});
});
document.getElementById("pw").addEventListener("keydown",function(e){
  if(e.key==="Enter") document.getElementById("go").click();
});

/* resume from a stored token */
if(tok()){
  api("/api/admin/overview").then(function(j){
    if(j&&j.ok!==false) enter("(resumed)");
    else GATE.style.display="block";
  }).catch(function(){GATE.style.display="block"});
} else {
  var e0=document.getElementById("em"); if(e0) e0.focus();
}
</script></body></html>
