<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Alfred · Console</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8eef5;font:14px/1.5 system-ui,-apple-system,sans-serif}
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 50% -8%,#11253e 0%,#070b11 58%) #070b11;z-index:50}
.lg-mark{width:86px;height:86px;border-radius:50%;border:2px solid rgba(127,196,255,.4);display:flex;align-items:center;justify-content:center;font-size:34px;color:#7fc4ff;box-shadow:0 0 44px rgba(46,127,214,.28),inset 0 0 26px rgba(46,127,214,.14)}
.lg-kick{letter-spacing:.34em;font-size:10px;color:#6f8aa3;margin-top:20px}
.lg-card{width:min(360px,88vw);margin-top:20px;background:rgba(13,20,29,.92);border:1px solid #1d2a38;border-radius:16px;padding:22px}
.lg-card h3{margin:0 0 2px;font-size:16px;letter-spacing:.06em}
.lg-card p{margin:0 0 14px;font-size:11px;color:#7d93a8}
.lg-card input{width:100%;margin:0 0 10px;padding:12px 13px;font-size:14px;background:#0a0f16;border:1px solid #24313f;border-radius:10px;color:#e8eef5}
.lg-card button{width:100%;padding:12px;font:600 12px system-ui;letter-spacing:.14em;background:#2e7fd6;color:#fff;border:0;border-radius:10px;cursor:pointer}
.lg-foot{font-size:10px;color:#4f6478;margin-top:14px;text-align:center;line-height:1.6}
.hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #1c2733;position:sticky;top:0;background:#0b0f14;z-index:5}
.hdr b{letter-spacing:.14em;font-size:13px}
.v1{font:10px system-ui;color:#8fb8d8;border:1px solid rgba(159,216,255,.35);border-radius:99px;padding:1px 8px}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid #24313f;color:#9fb4c8;border-radius:99px;padding:7px 14px;font:12px system-ui;cursor:pointer}
.tabs button.on{background:#2e7fd6;border-color:#2e7fd6;color:#fff}
main{padding:14px 16px 60px;max-width:1080px;margin:0 auto}
.card{background:#101720;border:1px solid #1c2733;border-radius:14px;padding:13px;margin-bottom:12px;overflow-x:auto}
.card h4{margin:0 0 9px;font-size:13px;color:#cfe4f5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#101720;border:1px solid #1c2733;border-radius:14px;padding:13px}
.kpi b{display:block;font-size:24px;color:#7fc4ff}
.kpi span{font-size:11px;color:#8ba1b5}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #1c2733;white-space:nowrap}
th{color:#8ba1b5;font-weight:600}
input,select,textarea{background:#0b0f14;border:1px solid #24313f;color:#e8eef5;border-radius:9px;padding:8px 10px;font:12px system-ui}
textarea{width:100%;min-height:84px;resize:vertical}
.act{background:#2e7fd6;color:#fff;border:0;border-radius:9px;padding:8px 14px;font:12px system-ui;cursor:pointer}
.ghost{background:transparent;color:#9fb4c8;border:1px solid #24313f;border-radius:9px;padding:8px 12px;font:12px system-ui;cursor:pointer}
.mut{color:#8ba1b5;font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hide{display:none!important}
</style></head><body>
<div id=login>
 <div class=lg-mark>◈</div>
 <div class=lg-kick>ALFRED</div>
 <div class=lg-card>
  <h3>Owner Console</h3>
  <p>Private control surface — authorized access only</p>
  <input id=em type=email placeholder="Owner email" autocomplete=username>
  <input id=pw type=password placeholder="Password" autocomplete=current-password onkeydown="if(event.key=='Enter')go()">
  <button onclick="go()">UNLOCK CONSOLE</button>
  <p class=mut id=lmsg style="margin-top:10px"></p>
 </div>
 <div class=lg-foot>Credentials live in <code>backend/keys.env</code> on the host.<br>Rotate anytime — rerun the key section or edit the file.</div>
</div>
<div id=app class=hide>
 <div class=hdr><b>ALFRED CONSOLE</b><span class=v1>V1</span>
  <button class=ghost style="margin-left:auto" onclick="try{sessionStorage.removeItem('ac_tok')}catch(e){};location.reload()">Lock</button></div>
 <div class=tabs id=tabs></div>
 <main id=main></main>
</div>
<script>
var TOK="";
try{TOK=sessionStorage.getItem("ac_tok")||""}catch(e){}
function api(p,o){o=o||{};o.headers=Object.assign({"X-Alfred-Token":TOK,"Content-Type":"application/json"},o.headers||{});
 if(o.body&&typeof o.body!="string")o.body=JSON.stringify(o.body);
 return fetch(p,o).then(function(r){return r.json().catch(function(){return{}})})}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function go(){
 var em=document.getElementById("em").value.trim(), p=document.getElementById("pw").value;
 var lm=document.getElementById("lmsg"); lm.textContent="";
 api("/api/auth/login",{method:"POST",body:{email:em,password:p}}).then(function(j){
  if(!j.ok||!j.token){lm.textContent=j.error||"wrong email or password";return}
  TOK=j.token;
  api("/api/admin/metrics").then(function(m){
   if(m.ok){try{sessionStorage.setItem("ac_tok",TOK)}catch(e){}boot()}
   else{lm.textContent="this account is not the owner";TOK=""}
  })})}
function boot(){
 document.getElementById("login").classList.add("hide");
 document.getElementById("app").classList.remove("hide");
 nav(0);
 api("/api/admin/metrics").then(function(j){if(!j.ok){try{sessionStorage.removeItem("ac_tok")}catch(e){}location.reload()}})}
function esc2(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function vCred2(m){
 var wrap=el("div","card");
 wrap.innerHTML="<h4>Credits - live control</h4><p class=mut>Base = plan daily credits. Extra = your top-ups. Left = spendable today.</p>";
 m.appendChild(wrap);
 var tb=el("div","card"); m.appendChild(tb);
 function load(){
  api("/api/admin/credits/full").then(function(j){
   if(!j.ok){tb.innerHTML="<p class=mut>"+esc2(j.error||"auth needed")+"</p>";return}
   var caps=j.caps||{};
   var rows=(j.rows||[]).map(function(r){
    var base=caps[r.plan]||0, left=Math.max(0,base+(r.extra||0)-(r.used||0));
    return "<tr><td>"+esc2(r.email)+"</td><td>"+esc2(r.plan)+"</td><td>"+(r.used||0)+"</td><td>"+base+"</td><td>"+(r.extra||0)+"</td><td><b>"+left+"</b></td>"
     +"<td><button data-a=10 data-e=\""+esc2(r.email)+"\">+10</button> <button data-a=25 data-e=\""+esc2(r.email)+"\">+25</button> <button data-a=100 data-e=\""+esc2(r.email)+"\">+100</button> <button data-a=reset data-e=\""+esc2(r.email)+"\">reset</button></td></tr>";
   }).join("");
   tb.innerHTML="<h4>Users - day "+esc2(j.day)+"</h4><table><tr><th>Email</th><th>Plan</th><th>Used</th><th>Base</th><th>Extra</th><th>Left</th><th>Top up</th></tr>"+rows+"</table>"
    +"<p class=mut>Base caps: Free "+esc2(caps.Free)+" / Pro "+esc2(caps.Pro)+" / Ultra "+esc2(caps.Ultra)+"</p>";
   [].slice.call(tb.querySelectorAll("button")).forEach(function(b){
    b.onclick=function(){
     var em=b.getAttribute("data-e"), a=b.getAttribute("data-a");
     b.disabled=true;
     var p2=(a==="reset")?api("/api/admin/credits/set",{method:"POST",body:{email:em,extra:0}})
       :api("/api/admin/credits/add",{method:"POST",body:{email:em,add:parseInt(a,10)}});
     p2.then(function(){load()});
    };
   });
  });
 }
 load();
 var ce=el("div","card");
 ce.innerHTML="<h4>Base credits per level</h4><p class=mut>Applies from the next message - no restart needed.</p>"
  +"<label>Free <input id=capFree type=number min=1 max=100000 style=width:90px></label> "
  +"<label>Pro <input id=capPro type=number min=1 max=100000 style=width:90px></label> "
  +"<label>Ultra <input id=capUltra type=number min=1 max=100000 style=width:90px></label> "
  +"<button id=capSave>Save caps</button> <span id=capMsg class=mut></span>";
 m.appendChild(ce);
 api("/api/admin/credits/full").then(function(j){
  if(!j.ok)return; var c=j.caps||{};
  var f=document.getElementById("capFree"),p=document.getElementById("capPro"),u=document.getElementById("capUltra");
  if(f)f.value=c.Free||60; if(p)p.value=c.Pro||120; if(u)u.value=c.Ultra||500;
 });
 var sb=document.getElementById("capSave");
 if(sb)sb.onclick=function(){
  var msg=document.getElementById("capMsg"), done=0, total=0;
  ["Free","Pro","Ultra"].forEach(function(k){
   var v=parseInt((document.getElementById("cap"+k)||{}).value,10);
   if(v>=1&&v<=100000){
    total++;
    api("/api/admin/caps/set",{method:"POST",body:{plan:k,cap:v}}).then(function(j){
     done++; if(msg)msg.textContent="saved "+done+"/"+total+(j&&j.ok?"":" ERROR");
    });
   }
  });
  if(!total&&msg)msg.textContent="nothing valid to save";
 };
}
var TABS=[["Overview",vOver],["Users",vUsers],["Credits",vCred2],["Brain",vBrain],["Providers",vProv],["Memory",vMem],["Showcase",vShow]];
function nav(i){
 var t=document.getElementById("tabs");t.innerHTML="";
 TABS.forEach(function(x,k){var b=el("button","",x[0]);if(k==i)b.className="on";b.onclick=function(){nav(k)};t.appendChild(b)});
 var m=document.getElementById("main");m.innerHTML="";TABS[i][1](m)}
function kpi(v,l){return '<div class=kpi><b>'+(v==null?"—":v)+"</b><span>"+l+"</span></div>"}
function vOver(m){
 api("/api/admin/metrics").then(function(j){var x=j.metrics||{};
  m.appendChild(el("div","kpis",kpi(x.msgs_24h,"Messages 24h")+kpi(x.chats_total,"Chats")+kpi(x.active_sessions,"Active sessions")+kpi(x.failed_24h,"Failed 24h")))});
 api("/api/admin/overview").then(function(j){
  var rows=(j.users||[]).map(function(u){return "<tr><td>"+u.id+"</td><td>"+(u.email||"")+"</td><td>"+(u.name||"")+"</td><td>"+(u.plan||"")+"</td></tr>"}).join("");
  m.appendChild(el("div","card","<h4>Users</h4><table><tr><th>ID</th><th>Email</th><th>Name</th><th>Plan</th></tr>"+rows+"</table>"))})}
function vUsers(m){
 api("/api/admin/overview").then(function(j){
  var c=el("div","card");c.appendChild(el("h4","","Plan control"));
  var tb=document.createElement("table");
  tb.innerHTML="<tr><th>Email</th><th>Plan</th><th></th></tr>";
  (j.users||[]).forEach(function(u){
   var tr=document.createElement("tr");
   var d1=document.createElement("td");d1.textContent=u.email;
   var d2=document.createElement("td");var s=document.createElement("select");
   ["Free","Pro","Ultra"].forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;if(p===u.plan)o.selected=true;s.appendChild(o)});
   d2.appendChild(s);
   var d3=document.createElement("td");var b=document.createElement("button");b.className="act";b.textContent="Apply";
   b.onclick=function(){api("/api/admin/users/plan",{method:"POST",body:{email:u.email,plan:s.value}}).then(function(r){b.textContent=r.ok?"✓":"✗";setTimeout(function(){b.textContent="Apply"},1500)})};
   d3.appendChild(b);tr.appendChild(d1);tr.appendChild(d2);tr.appendChild(d3);tb.appendChild(tr)});
  c.appendChild(tb);m.appendChild(c)})}
function vCred(m){
 api("/api/admin/metrics").then(function(j){var x=j.metrics||{};
  m.appendChild(el("div","kpis",kpi(x.msgs_24h,"Messages today")+kpi(x.chats_total,"Total chats")+kpi(x.failed_24h,"Failed today")+kpi(x.active_sessions,"Sessions")))});
 api("/api/admin/brain").then(function(j){
  if(!j.ok){m.appendChild(el("div","card","Brain API: "+(j.error||"?")));return}
  var c=j.config||{},caps=c.daily_caps||{};
  var card=el("div","card","<h4>Plan caps — messages per user per day</h4>");
  var row=el("div","row");
  ["Free","Pro","Ultra"].forEach(function(p){
   var i=document.createElement("input");i.placeholder=p+" cap";i.style.width="110px";i.value=caps[p]!=null?caps[p]:"";i.id="cr-"+p;row.appendChild(i)});
  var m2=document.createElement("input");m2.placeholder="per-minute limit";m2.style.width="130px";m2.value=c.minute_limit!=null?c.minute_limit:"";m2.id="cr-min";row.appendChild(m2);
  var sv=document.createElement("button");sv.className="act";sv.textContent="Save caps";
  sv.onclick=function(){var nc={};["Free","Pro","Ultra"].forEach(function(p){var e=document.getElementById("cr-"+p);if(e&&e.value!=="")nc[p]=parseInt(e.value,10)||1});
   var ml=document.getElementById("cr-min").value;
   var body={daily_caps:nc,caps:nc};if(ml!=="")body.minute_limit=parseInt(ml,10)||1;
   api("/api/admin/brain",{method:"POST",body:body}).then(function(r){sv.textContent=r.ok?"Saved ✓":(r.error||"failed");setTimeout(function(){sv.textContent="Save caps"},1800)})};
  row.appendChild(sv);card.appendChild(row);
  card.appendChild(el("div","mut","Caps reset at midnight UTC. Free users see the upgrade prompt when they hit the wall."));
  m.appendChild(card)})}
function vBrain(m){
 api("/api/admin/brain").then(function(j){
  if(!j.ok){m.appendChild(el("div","card","Brain API: "+(j.error||"?")));return}
  var c=j.config||{};
  var card=el("div","card","<h4>Engine</h4><p class=mut>key: "+(c.gemini_key||"—")+" · context msgs: "+(c.context_messages!=null?c.context_messages:"—")+"</p>");
  card.appendChild(el("div","","<h4>Default model chain (first = best, one per line)</h4>"));
  var ta=document.createElement("textarea");ta.value=(c.chain||[]).join("\n");card.appendChild(ta);
  var sv=document.createElement("button");sv.className="act";sv.textContent="Save chain";
  sv.onclick=function(){api("/api/admin/brain",{method:"POST",body:{chain:ta.value.split("\n").map(function(x){return x.trim()}).filter(Boolean)}}).then(function(r){sv.textContent=r.ok?"Saved ✓":"failed";setTimeout(function(){sv.textContent="Save chain"},1500)})};
  card.appendChild(sv);m.appendChild(card);
  m.appendChild(el("div","card mut","After saving, restart the brain in Termux:<br><code>pkill -f backend/brain.py; nohup python3 backend/brain.py &amp;</code>"))})}
function vProv(m){
 api("/api/admin/providers").then(function(j){
  if(!j.ok){m.appendChild(el("div","card","Providers API: "+(j.error||"?")));return}
  var ps=j.providers||j.list||[];
  var c=el("div","card","<h4>Registered providers</h4>");
  var html="";
  ps.forEach(function(p){
    var k=p.api_key||p.key||"";
    var mask=k?(k.slice(0,6)+"••••••••"):"—";
    html+="<b>"+(p.id||p.name||"?")+"</b> · "+(p.base_url||p.base||"")+" · key: "+mask+"<br>"});
  c.appendChild(el("div","mut",ps.length?html:"—"));
  var ch=j.chains||{},cl="";for(var k2 in ch)cl+="<b>"+k2+"</b>: "+(ch[k2]||[]).join(" → ")+"<br>";
  c.appendChild(el("div","mut",cl||""));
  c.appendChild(el("div","mut","Catalog scan + per-model assign lands in the next console round."));
  m.appendChild(c);
  var t=el("div","card","<h4>Test a model live</h4>");
  var r1=el("div","row");var mi=document.createElement("input");mi.placeholder="model id (e.g. pollinations/openai)";mi.style.flex="1";r1.appendChild(mi);
  var tb=document.createElement("button");tb.className="act";tb.textContent="Test";
  tb.onclick=function(){tb.textContent="…";api("/api/admin/providers/test",{method:"POST",body:{model:mi.value}}).then(function(r){tb.textContent=r.alive?("alive ✓ "+(r.ms||"")+"ms"):(r.error||"dead");setTimeout(function(){tb.textContent="Test"},2500)})};
  r1.appendChild(tb);t.appendChild(r1);m.appendChild(t);
  var a=el("div","card","<h4>Add a provider</h4>");
  var r2=el("div","row");
  var ii=document.createElement("input");ii.placeholder="id (groq)";ii.style.width="90px";
  var bi=document.createElement("input");bi.placeholder="base_url";bi.style.flex="1";
  var ki=document.createElement("input");ki.placeholder="api_key (stored server-side, masked here)";ki.style.flex="1";ki.type="password";
  var ab=document.createElement("button");ab.className="act";ab.textContent="Add";
  ab.onclick=function(){api("/api/admin/providers/add",{method:"POST",body:{id:ii.value,type:"openai",base_url:bi.value,api_key:ki.value}}).then(function(r){ab.textContent=r.ok?"✓ added":(r.error||"failed");setTimeout(function(){ab.textContent="Add"},2000)})};
  r2.appendChild(ii);r2.appendChild(bi);r2.appendChild(ki);r2.appendChild(ab);a.appendChild(r2);m.appendChild(a);
  var sc=el("div","card","<h4>Level chains (one model per line)</h4>");
  ["Free","Pro","Ultra"].forEach(function(p){
   sc.appendChild(el("div","","<b>"+p+"</b>"));
   var ta2=document.createElement("textarea");ta2.value=(ch[p]||[]).join("\n");ta2.style.minHeight="54px";sc.appendChild(ta2);
   var sv2=document.createElement("button");sv2.className="act";sv2.textContent="Set "+p;
   sv2.onclick=function(){api("/api/admin/providers/chains",{method:"POST",body:{plan:p,models:ta2.value.split("\n").map(function(x){return x.trim()}).filter(Boolean)}}).then(function(r){sv2.textContent=r.ok?"✓":"failed";setTimeout(function(){sv2.textContent="Set "+p},1500)})};
   sc.appendChild(sv2)});
  m.appendChild(sc)})}
function vMem(m){
 var c=el("div","card","<h4>Memory pins</h4>");
 var r=el("div","row");var ei=document.createElement("input");ei.placeholder="user email";ei.style.flex="1";r.appendChild(ei);
 var lb=document.createElement("button");lb.className="act";lb.textContent="Load";
 var list=el("div","");
 lb.onclick=function(){api("/api/admin/memory/list",{method:"POST",body:{email:ei.value}}).then(function(j){
  list.innerHTML="";(j.items||[]).forEach(function(it){
   var row=el("div","row");var s=el("span","mut",it.text||"");s.style.flex="1";row.appendChild(s);
   var x=document.createElement("button");x.className="ghost";x.textContent="×";
   x.onclick=function(){api("/api/admin/memory/delete",{method:"POST",body:{id:it.id}}).then(function(){lb.click()})};
   row.appendChild(x);list.appendChild(row)});
  if(!(j.items||[]).length)list.appendChild(el("div","mut","none"))})};
 r.appendChild(lb);c.appendChild(r);c.appendChild(list);m.appendChild(c)}
function vShow(m){
 var c=el("div","card","<h4>Modules showcase (Name | Description | Tier — one per line)</h4>");
 var ta=document.createElement("textarea");ta.placeholder="Nano Vision | Sees and reasons about your images | Pro";
 c.appendChild(ta);
 var r=el("div","row");
 var pb=document.createElement("button");pb.className="act";pb.textContent="Publish";
 pb.onclick=function(){var items=ta.value.split("\n").map(function(l){var p=l.split("|");if(!p[0]||!p[0].trim())return null;return{name:(p[0]||"").trim(),desc:(p[1]||"").trim(),tier:(p[2]||"Pro").trim()}}).filter(Boolean);
  api("/api/admin/showcase",{method:"POST",body:{items:items}}).then(function(j){pb.textContent=j.ok?("Published ✓ "+j.count):(j.error||"failed");setTimeout(function(){pb.textContent="Publish"},2000)})};
 var ld=document.createElement("button");ld.className="ghost";ld.textContent="Load current";
 ld.onclick=function(){fetch("/showcase.json").then(function(x){return x.ok?x.json():{items:[]}}).then(function(j){ta.value=(j.items||[]).map(function(i){return i.name+" | "+i.desc+" | "+i.tier}).join("\n")})};
 r.appendChild(pb);r.appendChild(ld);c.appendChild(r);m.appendChild(c)}
if(TOK){api("/api/admin/metrics").then(function(m){if(m.ok)boot();else{try{sessionStorage.removeItem("ac_tok")}catch(e){}TOK=""}})}

var _p318 = vProv;
vProv = function(m){ _p318(m); catCard(m); };
function catCard(m){
 var c=el("div","card","<h4>Model catalog — scan providers, assign to a level</h4>");
 var r=el("div","row");var rb=document.createElement("button");rb.className="act";rb.textContent="Refresh models";
 var out=el("div","");
 rb.onclick=function(){rb.textContent="scanning…";out.innerHTML="";
  api("/api/admin/models/catalog").then(function(j){
   rb.textContent="Refresh models";
   if(!j.ok){out.appendChild(el("div","mut",j.error||"scan failed"));return}
   var pv=j.providers||{};
   Object.keys(pv).forEach(function(pid){
    var x=pv[pid]||{};
    var head=el("div","","<b>"+pid+"</b> "+(x.err?("· <span class=mut>"+x.err+"</span>"):("· "+(x.total||0)+" models")));
    out.appendChild(head);
    (x.models||[]).slice(0,80).forEach(function(mid){
     var row=el("div","row");
     var s1=document.createElement("span");s1.className="mut";s1.textContent=mid;s1.style.flex="1";s1.style.overflow="hidden";
     var s2=document.createElement("select");["Free","Pro","Ultra"].forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;s2.appendChild(o)});
     var ab=document.createElement("button");ab.className="ghost";ab.textContent="+ level";
     ab.onclick=function(){api("/api/admin/models/assign",{method:"POST",body:{model:mid,level:s2.value,pid:pid}}).then(function(r2){ab.textContent=r2.ok?("✓ "+s2.value):(r2.error||"✗");setTimeout(function(){ab.textContent="+ level"},1600)})};
     row.appendChild(s1);row.appendChild(s2);row.appendChild(ab);out.appendChild(row);
    });
   });
  })};
 r.appendChild(rb);c.appendChild(r);c.appendChild(out);m.appendChild(c);
 var note=el("div","card mut","Keys live server-side (masked). Rotate anytime: re-add the provider with a new key — it overwrites. Catalog snapshot also saved to backend/catalog.json.");
 m.appendChild(note);}
var _c318 = vCred;
vCred = function(m){ _c318(m); credRows(m); };
function credRows(m){
 var c=el("div","card","<h4>Per-user usage today</h4>");
 var tb=el("div","mut","loading…");c.appendChild(tb);m.appendChild(c);
 api("/api/admin/credits").then(function(j){
